<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Ori Agent · Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f46e5'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>O</text></svg>" />
<link rel="stylesheet" href="/admin/styles.css" />
<!-- Blocking and separate rather than inline: it must run before first paint so
     a dark-theme reload does not flash white, and a file keeps the CSP at
     script-src 'self' with no hash to keep in sync. -->
<script src="/admin/theme.js"></script>
</head>
<body>

<!-- Every screen is rendered by app.js into one of these three roots. Only one
     is ever visible; `[hidden]` is forced with !important in the stylesheet so
     a class that sets `display` cannot show two at once. -->
<div id="setup" hidden></div>
<div id="login" hidden></div>
<div id="app" hidden></div>

<div id="modal-root" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/admin/app.js"></script>
</body>
</html>
